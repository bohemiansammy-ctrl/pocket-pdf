<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F766E">
  <title>Pocket PDF</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="home" class="screen">
    <button id="scan-btn" class="scan-btn" type="button">Scan</button>
    <p id="message" class="message" role="status" hidden></p>
    <p class="version">Version <span id="version"></span></p>
  </main>

  <div id="update-banner" class="banner" role="alert" hidden>
    <span>A new version is ready.</span>
    <button id="update-btn" class="btn-secondary" type="button">Update now</button>
  </div>

  <script src="version.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
