<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F6E56">
  <title>Pocket PDF</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="home" class="screen">
    <header class="brand">
      <img class="brand-logo" src="icons/logo.svg" alt="">
      <h1 class="wordmark">Pocket <span class="wordmark-accent">PDF</span></h1>
    </header>
    <button id="scan-btn" class="scan-btn" type="button">Scan</button>
    <p id="message" class="message" role="status" hidden></p>
    <p class="version">Version <span id="version"></span></p>
    <input id="camera" type="file" accept="image/*" capture="environment" hidden>
  </main>

  <main id="working" class="screen screen-centre" hidden>
    <div class="spinner" aria-hidden="true"></div>
    <p id="working-text" class="working-text">Finding the page…</p>
    <p id="working-hint" class="working-hint">The first scan takes longer while the app gets ready.</p>
  </main>

  <main id="adjust" class="screen" hidden>
    <p id="adjust-note" class="adjust-note" role="status">Drag the dots to the corners of the page.</p>
    <div id="adjust-stage" class="adjust-stage">
      <div id="adjust-wrap" class="adjust-wrap">
        <img id="adjust-photo" class="adjust-photo" alt="Your photo">
        <svg class="adjust-lines" viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true">
          <polygon class="outline-halo"></polygon>
          <polygon id="adjust-outline" class="outline-line"></polygon>
        </svg>
        <button class="corner" type="button" aria-label="Top-left corner"></button>
        <button class="corner" type="button" aria-label="Top-right corner"></button>
        <button class="corner" type="button" aria-label="Bottom-right corner"></button>
        <button class="corner" type="button" aria-label="Bottom-left corner"></button>
      </div>
    </div>
    <div class="button-row">
      <button id="retake-btn" class="btn-secondary" type="button">Retake</button>
      <button id="accept-btn" class="btn-primary" type="button">Looks good</button>
    </div>
  </main>

  <main id="result" class="screen" hidden>
    <p id="result-note" class="message" role="status" hidden></p>
    <div class="preview-box">
      <img id="preview" class="preview" alt="Your straightened page">
    </div>
    <button id="share-btn" class="btn-primary" type="button">Share PDF</button>
    <button id="again-btn" class="btn-secondary" type="button">Scan again</button>
  </main>

  <div id="update-banner" class="banner" role="alert" hidden>
    <span>A new version is ready.</span>
    <button id="update-btn" class="btn-secondary" type="button">Update now</button>
  </div>

  <script src="version.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
